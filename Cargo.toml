[package]
name = "check-npm-version"
version = "0.1.0"
edition = "2024"

[dependencies]
semver = "1.0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
reqwest = { version="0.12.23", features = ["blocking", "json"] }
chrono = "0.4.41"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros"] }